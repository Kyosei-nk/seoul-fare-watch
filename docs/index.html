<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ソウル航空券ウォッチ</title>
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="theme-color" content="#2a78d6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root {
  color-scheme: light;
  --bg: #f4f4f2; --surface: #fcfcfb; --border: #e3e2de;
  --text-1: #0b0b0b; --text-2: #52514e; --text-3: #8a8984;
  --series: #2a78d6; --grid: #ecebe7;
  --good: #0f7b3e; --good-bg: #e4f4ea; --bad: #b42318; --bad-bg: #fde8e6;
  --warn: #8a5a00; --warn-bg: #fff3d6;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #111110; --surface: #1a1a19; --border: #2e2e2c;
    --text-1: #f0efec; --text-2: #c3c2b7; --text-3: #8d8c85;
    --series: #3987e5; --grid: #262624;
    --good: #5fd08f; --good-bg: #12301f; --bad: #ff8a80; --bad-bg: #3a1714;
    --warn: #f0c060; --warn-bg: #33270b;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #111110; --surface: #1a1a19; --border: #2e2e2c;
  --text-1: #f0efec; --text-2: #c3c2b7; --text-3: #8d8c85;
  --series: #3987e5; --grid: #262624;
  --good: #5fd08f; --good-bg: #12301f; --bad: #ff8a80; --bad-bg: #3a1714;
  --warn: #f0c060; --warn-bg: #33270b;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text-1);
  font: 15px/1.5 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
  -webkit-text-size-adjust: 100%; }
main { max-width: 560px; margin: 0 auto; padding: 16px 16px 40px; }
header h1 { font-size: 18px; margin: 4px 0 2px; }
header .sub { color: var(--text-2); font-size: 13px; }
.banner { margin: 12px 0; padding: 10px 12px; border-radius: 10px; font-size: 13px; }
.banner.warn { background: var(--warn-bg); color: var(--warn); }
.banner.bad { background: var(--bad-bg); color: var(--bad); }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
  padding: 16px; margin-top: 14px; }
.card h2 { font-size: 15px; margin: 0; font-weight: 600; }
.card .route-sub { color: var(--text-3); font-size: 12px; }
.price { font-size: 34px; font-weight: 700; letter-spacing: -0.5px; margin: 8px 0 2px;
  font-variant-numeric: tabular-nums; }
.price.na { font-size: 20px; color: var(--text-3); font-weight: 500; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 10px; }
.chip { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--bg);
  color: var(--text-2); font-variant-numeric: tabular-nums; }
.chip.down { background: var(--good-bg); color: var(--good); }
.chip.up { background: var(--bad-bg); color: var(--bad); }
.advice { display: flex; flex-direction: column; gap: 2px; padding: 9px 12px; border-radius: 10px;
  margin: 2px 0 10px; font-size: 13px; background: var(--bg); color: var(--text-2); }
.advice b { color: var(--text-1); font-size: 14px; }
.advice.consider { background: var(--warn-bg); } .advice.consider b { color: var(--warn); }
.advice.buy, .advice.urgent { background: var(--good-bg); } .advice.buy b, .advice.urgent b { color: var(--good); }
.advice.urgent { outline: 2px solid var(--good); }
.detail { font-size: 13px; color: var(--text-2); }
.detail b { color: var(--text-1); font-weight: 600; }
.chart { position: relative; margin: 12px 0 4px; touch-action: pan-y; }
.chart svg { display: block; width: 100%; height: 150px; overflow: visible; }
.tip { position: absolute; top: 0; pointer-events: none; background: var(--text-1); color: var(--surface);
  font-size: 12px; padding: 4px 8px; border-radius: 6px; white-space: nowrap; transform: translateX(-50%);
  display: none; font-variant-numeric: tabular-nums; }
.btn { display: block; text-align: center; margin-top: 12px; padding: 11px; border-radius: 10px;
  background: var(--series); color: #fff; text-decoration: none; font-weight: 600; font-size: 14px; }
details { margin-top: 10px; font-size: 13px; color: var(--text-2); }
table { width: 100%; border-collapse: collapse; margin-top: 6px; font-variant-numeric: tabular-nums; }
td, th { padding: 4px 2px; border-bottom: 1px solid var(--grid); text-align: left; font-weight: 400; }
td:last-child, th:last-child { text-align: right; }
footer { margin-top: 20px; color: var(--text-3); font-size: 12px; text-align: center; }
button.reload { background: none; border: 1px solid var(--border); color: var(--text-2);
  border-radius: 8px; padding: 6px 12px; font: inherit; margin-top: 8px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>ソウル航空券ウォッチ</h1>
    <div class="sub" id="sub">読み込み中…</div>
  </header>
  <div id="banner"></div>
  <div id="cards"></div>
  <footer>
    <div id="updated"></div>
    <div>Trip.com の価格カレンダーにある往復・大人1名・エコノミーの最安値です。実際の検索結果とは数百〜千円ほどずれることがあります。</div>
    <button class="reload" onclick="load()">再読み込み</button>
  </footer>
</main>
<script>
// 画面のコードは毎回最新を読む（ページ自体がキャッシュされていても更新が反映されるように）
const loader = document.createElement("script");
loader.src = "app.js?t=" + Date.now();
document.body.appendChild(loader);
</script>
</body>
</html>
