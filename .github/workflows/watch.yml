name: watch-fares
on:
  schedule:
    # 30分おきに起動。実際の取得は前回成功から100分以上たったときだけ（main.py が判定）。
    # GitHub の定期実行は混雑時に数時間遅れたり抜けたりするため、起動回数を多めにしている。
    - cron: "17,47 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: watch
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: fetch & notify
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TZ: Asia/Tokyo
        run: python src/main.py ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
      - name: commit data
        run: |
          git config user.name "fare-bot"
          git config user.email "fare-bot@users.noreply.github.com"
          git add docs/data state
          git diff --cached --quiet || git commit -m "fares $(TZ=Asia/Tokyo date +%m/%d-%H:%M) JST"
          git push
